<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lee Ambrose Park</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem;
      background: #fafafa;
      color: #232323;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 18rem); text-align: center; }
    img { display: block; width: 100%; height: auto; border-radius: 3px; }
    h1 { margin: 1.5rem 0 .65rem; font-size: 1.25rem; font-weight: 500; line-height: 1.5; }
    a { display: inline-block; padding: .5rem; color: inherit; font-size: 1rem; line-height: 1.5; text-underline-offset: .25em; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
    @media (prefers-color-scheme: dark) {
      body { background: #171717; color: #ededed; }
    }
  </style>
</head>
<body>
  <main>
    <img src="./assets/official-portrait.jpg" alt="Lee Ambrose Park">
    <h1>Lee Ambrose Park</h1>
    <a href="https://www.linkedin.com/in/leepark/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </main>
</body>
</html>
